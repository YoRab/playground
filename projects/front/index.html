<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground</title>

  <!-- same as Mantine's ColorSchemeScript: apply the saved color scheme before the first paint -->
  <script>
    try {
      const saved = window.localStorage.getItem('mantine-color-scheme-value');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const colorScheme = saved === 'light' || saved === 'dark' ? saved : prefersDark ? 'dark' : 'light';
      document.documentElement.setAttribute('data-mantine-color-scheme', colorScheme);
    } catch {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
